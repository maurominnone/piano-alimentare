<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7f2"><meta name="description" content="Il tuo piano alimentare, semplice da seguire ogni giorno."><title>Ogni giorno · Il mio piano alimentare</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#f8f7f2;--paper:#fff;--ink:#202b25;--muted:#78837a;--green:#254f3e;--soft:#e9efe7;--border:#e7e9e2;--peach:#faede3;--blue:#eaf0f2;--shadow:0 12px 38px #2a42300b;font-family:'DM Sans',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9bc7a8;outline-offset:2px}.app{max-width:1180px;margin:auto;display:grid;grid-template-columns:225px minmax(0,1fr);min-height:100vh}.sidebar{padding:34px 18px;border-right:1px solid var(--border);position:sticky;top:0;height:100vh}.brand{font-family:Manrope,sans-serif;font-size:22px;font-weight:800;letter-spacing:-1.1px;margin:0 12px 46px}.brand span{color:#86a58b}.nav{display:grid;gap:7px}.nav button{display:flex;align-items:center;gap:13px;width:100%;border:0;background:transparent;text-align:left;padding:14px 16px;border-radius:14px;color:#6c796e;font-weight:700}.nav button.active{background:var(--soft);color:var(--green)}.nav svg{width:20px;height:20px}.sidefoot{position:absolute;bottom:35px;left:30px;right:20px;color:var(--muted);font-size:12px;line-height:1.65}.main{padding:38px clamp(18px,4vw,56px) 100px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:30px}.kicker{font-size:11px;letter-spacing:2px;font-weight:800;color:#718b75;text-transform:uppercase}.heading{font-family:Manrope,sans-serif;letter-spacing:-1.5px;font-size:clamp(28px,4vw,43px);line-height:1.14;margin:9px 0}.sub{color:var(--muted);line-height:1.6;margin:7px 0 0}.todaybadge{background:white;border:1px solid var(--border);border-radius:30px;padding:11px 16px;font-size:12px;font-weight:700;white-space:nowrap}.hero{background:#254f3e;color:white;border-radius:25px;padding:27px 30px;display:flex;align-items:center;justify-content:space-between;gap:25px;overflow:hidden;position:relative}.hero:after{content:'✳';position:absolute;right:22%;top:-83px;font-size:230px;color:#ffffff0a}.hero .kicker{color:#c0d7c4}.hero h2{font-family:Manrope,sans-serif;font-size:clamp(22px,3vw,31px);line-height:1.3;letter-spacing:-.8px;margin:10px 0}.hero p{color:#d3e2d6;font-size:13px;line-height:1.6;max-width:540px}.heroicon{font-size:78px;position:relative;z-index:1}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin:26px 0}.day{border:1px solid var(--border);background:white;border-radius:15px;padding:12px 4px;display:grid;gap:5px;text-align:center;color:var(--muted)}.day strong{font-size:12px}.day span{font-size:15px;font-weight:800;color:var(--ink)}.day.active{background:var(--green);border-color:var(--green);color:#d9e9dc}.day.active span{color:white}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 14px}.sectionhead h2{font:800 20px Manrope,sans-serif;letter-spacing:-.5px;margin:0}.textbutton{background:none;border:0;color:var(--green);font-size:13px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid var(--border);background:white;border-radius:20px;padding:21px;box-shadow:var(--shadow);min-width:0}.mealcard{display:flex;flex-direction:column;min-height:230px}.mealcard.primary{background:#f0f4ed}.mealhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{font-size:11px;font-weight:800;color:#6c856f;text-transform:uppercase;letter-spacing:1px}.done{border:1px solid #dce6d9;background:white;border-radius:30px;color:#5b7562;font-size:11px;font-weight:800;padding:7px 10px}.done.checked{background:var(--green);color:white}.mealcard h3{font:800 19px/1.4 Manrope,sans-serif;letter-spacing:-.5px;margin:20px 0 8px}.mealcard p{font-size:13px;color:var(--muted);line-height:1.65;margin:0 0 17px}.mealactions{display:flex;gap:9px;flex-wrap:wrap;margin-top:auto}.btn{border:0;border-radius:11px;padding:11px 14px;font-size:12px;font-weight:800;background:var(--green);color:white}.btn.ghost{background:#edf2eb;color:var(--green)}.btn.light{background:white;color:var(--green)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:white;border:1px solid var(--border);border-radius:16px;padding:18px}.stat strong{display:block;font:800 23px Manrope,sans-serif;color:var(--green)}.stat span{font-size:12px;color:var(--muted)}.tip{border-radius:18px;padding:18px 20px;background:var(--peach);font-size:13px;line-height:1.7;color:#765a46}.gridweek{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.weekcard{background:white;border:1px solid var(--border);border-radius:17px;padding:18px}.weekcard h3{font:800 16px Manrope,sans-serif;margin:0 0 14px}.weekmeal{margin:12px 0;font-size:13px;line-height:1.5}.weekmeal span{display:block;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:4px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--border);border-radius:30px;background:white;color:#607268;font-size:12px;font-weight:700;padding:10px 13px}.chip.active{background:var(--green);color:white;border-color:var(--green)}.swapgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{width:100%;padding:13px;border-radius:12px;border:1px solid #dce5da;background:#fff;color:var(--ink);margin:9px 0 13px}.fieldlabel{font-size:12px;font-weight:800;color:#627466}.result{background:var(--soft);border-radius:16px;padding:22px}.result h3{font:800 21px Manrope,sans-serif;margin:8px 0}.result .arrow{font-size:25px;color:#6c8a71}.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.rules .card h3{margin:0 0 12px;font:800 17px Manrope,sans-serif}.rules p,.rules li{font-size:13px;line-height:1.8;color:#64736a}.rules ul{padding-left:19px}.bottomnav{display:none}.overlay{position:fixed;inset:0;background:#18291c85;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.modal{background:white;border-radius:23px;width:min(540px,100%);padding:26px;max-height:88vh;overflow:auto}.modal h2{font:800 22px Manrope,sans-serif;margin:0 0 7px}.modal p{color:var(--muted);font-size:13px;line-height:1.7}.modalhead{display:flex;justify-content:space-between;align-items:start}.close{border:0;background:#f0f2ed;border-radius:50%;width:35px;height:35px;font-size:19px}.muted{color:var(--muted)}.small{font-size:12px;line-height:1.7}.notice{background:#fff7e9;padding:14px;border-radius:12px;color:#765b31;font-size:12px;line-height:1.65}.hidden{display:none}.foot{font-size:11px;color:#89958c;line-height:1.7;margin-top:30px}.shopping{display:grid;gap:9px}.shopping label{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:10px 0;border-bottom:1px solid var(--border)}.shopping input{accent-color:var(--green)}@media(max-width:850px){.app{display:block}.sidebar{display:none}.main{padding:23px 17px 105px}.bottomnav{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(4,1fr);background:#ffffffee;backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottomnav button{background:none;border:0;padding:8px 0;color:#859087;font-size:10px;font-weight:800;display:grid;justify-items:center;gap:4px}.bottomnav button.active{color:var(--green)}.bottomnav svg{width:21px;height:21px}.hero{padding:22px}.heroicon{font-size:50px}.top{margin-bottom:22px}}@media(max-width:560px){.cards,.gridweek,.swapgrid,.rules{grid-template-columns:1fr}.days{gap:5px}.day{border-radius:12px;padding:11px 1px}.day strong{font-size:10px}.day span{font-size:13px}.stats{gap:7px}.stat{padding:13px 10px}.stat strong{font-size:19px}.stat span{font-size:10px}.heroicon{display:none}.mealcard{min-height:0}.top{align-items:start}.todaybadge{padding:9px 10px;font-size:10px}.heading{font-size:30px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">ogni<span>giorno.</span></div><nav class="nav" id="desktopnav"></nav><div class="sidefoot">Il tuo piano, più semplice.<br>Basato sul documento del 23 ottobre 2026.</div></aside><main class="main" id="main"></main></div><nav class="bottomnav" id="mobilenav"></nav><div id="modalroot"></div><script>
const icons={oggi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M12 8v8"/></svg>',settimana:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg>',sostituzioni:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16l-4-4M20 17H4l4 4M20 7l-4 4M4 17l4-4"/></svg>',guida:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg>'};
const names=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const base=[[['Secondo di carne e contorno di verdure','carne',1],['Pasta con broccoli e branzino','pesce',0]],[['Secondo di formaggio e verdure (es. insalata con mozzarella)','formaggi',1],['Pasta al sugo e nodino di vitello','carne',0]],[['Secondo di pesce e contorno di verdure','pesce',1],['Riso venere, cavoletti di Bruxelles e tempeh','legumi',0]],[['Secondo di formaggio e verdure (es. insalata con mozzarella)','formaggi',1],['Couscous, bocconcini di tacchino e verdure','carne',0]],[['Secondo di pesce e contorno di verdure','pesce',1],['Pasta con zucchine e cannellini','legumi',0]],[['Bruschetta con hummus di ceci e zucca al forno','legumi',0],['A scelta (pasto libero occasionale)','libero',0]],[['Riso integrale con ceci e verdure','legumi',0],['Pollo al grill con patate, spinaci e pane','carne',0]]];
const proteins=[['Legumi cotti o in vetro','200 g','legumi'],['Piselli cotti','250 g','legumi'],['Legumi secchi / pasta 100% legumi','80 g','legumi'],['Tofu','180–200 g','legumi'],['Tempeh','150 g','legumi'],['Granulare di soia','70 g','legumi'],['Ricotta magra / fiocchi di latte magri','200 g','formaggi'],['Formaggi freschi magri','100 g','formaggi'],['Formaggi stagionati','50 g','formaggi'],['Pesce fresco','200 g','pesce'],['Salmone fresco','180 g','pesce'],['Pesce affumicato / in scatola','100 g','pesce'],['Carne magra','180 g','carne'],['Affettati magri','100 g','salumi']];
const groups={proteine:{label:'Proteine',items:proteins},pranzo:{label:'Carboidrati del pranzo',items:[['Pasta, riso, farro, couscous, quinoa, orzo','80 g'],['Gnocchi di patate','160 g']]},cena:{label:'Carboidrati della cena',items:[['Pane','80 g'],['Cracker','40 g'],['Wasa','5 pezzi'],['Patate','220 g']]},colazione:{label:'Grassi della colazione',items:[['Frutta secca','10 g'],['Tahina / burro di arachidi','8 g'],['Burro di arachidi degrassato in polvere','13 g']]},condimenti:{label:'Condimenti (riferimento: 10 g olio)',items:[['Olio','10 g'],['Pesto genovese senz’aglio','20 g'],['Avocado','40 g'],['Maionese','15 g']]}};
const defaultState={day:(new Date().getDay()+6)%7,tab:'oggi',custom:{},done:{},group:'proteine',from:0,to:1,shopChecks:{}};let state={...defaultState};try{const saved=JSON.parse(localStorage.getItem('ogni-giorno-v2')||'{}');state={...state,...saved,tab:'oggi'}}catch(e){};
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('ogni-giorno-v2',JSON.stringify(state))}catch(e){}};const current=(d,i)=>state.custom[d+'-'+i]||base[d][i];const header=(title,subtitle)=>`<div class="top"><div><div class="kicker">IL MIO PIANO ALIMENTARE</div><h1 class="heading">${title}</h1><p class="sub">${subtitle}</p></div><div class="todaybadge">🌿 Piano personale</div></div>`;const daynav=()=>`<div class="days">${names.map((n,i)=>`<button class="day ${state.day===i?'active':''}" data-day="${i}"><strong>${n.slice(0,3)}</strong><span>${i+1}</span></button>`).join('')}</div>`;
const daily=[['Colazione','Latte 250 ml, pane integrale 60 g, miele/marmellata 10 g, frutto e fonte di grassi','Scegli: 10 g frutta secca oppure 8 g tahina/burro di arachidi oppure 13 g burro di arachidi degrassato in polvere.'],['Spuntino','Cracker · circa 30 g','Un pacchettino di cracker.'],['Merenda','Yogurt greco 0% · 120 g','Aggiungi 10 g di frutta secca e un frutto fresco.']];
function mealcard(title,desc,detail,key,editable=false,primary=false){const done=!!state.done[state.day+'-'+key];return `<article class="card mealcard ${primary?'primary':''}"><div class="mealhead"><span class="tag">${title}</span><button class="done ${done?'checked':''}" data-done="${key}">${done?'✓ Fatto':'○ Da fare'}</button></div><h3>${safe(desc)}</h3><p>${safe(detail)}</p><div class="mealactions">${editable?`<button class="btn" data-edit="${key}">Cambia pasto</button><button class="btn ghost" data-reset="${key}">Ripristina</button>`:`<button class="btn ghost" data-guide="${key==='colazione'?'colazione':'proteine'}">Vedi le alternative</button>`}</div></article>`}
function today(){let d=state.day;let lunch=current(d,0),dinner=current(d,1);return header('Cosa mangiamo oggi?','Tutto quello che ti serve, senza cercare nel PDF.')+`<section class="hero"><div><div class="kicker">IL PIANO DEL GIORNO</div><h2>${names[d]}<br>Un pasto alla volta.</h2><p>Puoi cambiare pranzo e cena, scegliere le alternative previste e tenere traccia dei pasti completati.</p></div><div class="heroicon">🥗</div></section>${daynav()}<div class="stats"><div class="stat"><strong>5</strong><span>momenti alimentari</span></div><div class="stat"><strong>1,5–2 L</strong><span>liquidi al giorno</span></div><div class="stat"><strong>15 + 15 g</strong><span>olio pranzo e cena</span></div></div><div class="sectionhead"><h2>I tuoi pasti</h2><button class="textbutton" data-tab="settimana">Vedi settimana →</button></div><div class="cards">${mealcard('Colazione',daily[0][1],daily[0][2],'colazione')}${mealcard('Spuntino',daily[1][1],daily[1][2],'spuntino')}${mealcard('Pranzo',lunch[0],lunch[2]?'Fuori casa: secondo + verdure + piccolo panino o grissini.':'Riferimento: 80 g cereali oppure 160 g gnocchi + proteine + verdure.','0',true,true)}${mealcard('Merenda',daily[2][1],daily[2][2],'merenda')}${mealcard('Cena',dinner[0],'Riferimento: pane 80 g oppure cracker 40 g oppure 5 wasa oppure patate 220 g + proteine + verdure.','1',true,true)}<article class="card mealcard"><div class="tag">PROMEMORIA</div><h3>Piccole cose importanti</h3><p>Frutta fresca circa 300 g al giorno, frutta secca/semi oleosi 20 g al giorno. Verdure ai pasti principali. Camminata di almeno 30 minuti.</p><div class="mealactions"><button class="btn ghost" data-tab="guida">Leggi le regole</button></div></article></div><p class="foot">Menù settimanale esemplificativo del piano del 23/10/2026. Le porzioni e le indicazioni del documento originale hanno priorità. I pasti modificati sono scelte personali e non vengono verificati clinicamente.</p>`}
function week(){return header('La tua settimana','Il menù della nutrizionista, modificabile giorno per giorno.')+`<div class="sectionhead"><h2>7 giorni, più flessibilità</h2><button class="textbutton" data-shopping="1">Lista della spesa orientativa →</button></div><div class="gridweek">${names.map((n,d)=>`<article class="weekcard"><h3>${n}</h3>${[0,1].map(i=>`<div class="weekmeal"><span>${i?'CENA':'PRANZO'} · ${safe(current(d,i)[1]).toUpperCase()}</span>${safe(current(d,i)[0])}</div>`).join('')}<button class="btn ghost" data-open-day="${d}">Apri e modifica</button></article>`).join('')}</div><div class="tip" style="margin-top:18px">Il menù settimanale è solo un esempio. Pranzo e cena sono intercambiabili. Alcuni piatti riportati nel PDF non indicano le grammature di ogni ingrediente: l'app non le inventa.</div>`}
function substitutions(){const g=groups[state.group],arr=g.items;const a=arr[Math.min(state.from,arr.length-1)],b=arr[Math.min(state.to,arr.length-1)];return header('Cambia, senza dubbi.','Le alternative e le porzioni riportate nel piano originale.')+`<div class="sectionhead"><h2>Cosa vuoi sostituire?</h2></div><div class="chips">${Object.entries(groups).map(([id,x])=>`<button class="chip ${state.group===id?'active':''}" data-group="${id}">${x.label}</button>`).join('')}</div><div class="swapgrid" style="margin-top:22px"><div class="card"><label class="fieldlabel" for="from">ALIMENTO DI PARTENZA</label><select class="field" id="from">${arr.map((x,i)=>`<option value="${i}" ${i===state.from?'selected':''}>${safe(x[0])} · ${safe(x[1])}</option>`).join('')}</select><label class="fieldlabel" for="to">ALTERNATIVA</label><select class="field" id="to">${arr.map((x,i)=>`<option value="${i}" ${i===state.to?'selected':''}>${safe(x[0])} · ${safe(x[1])}</option>`).join('')}</select><p class="small muted">Le grammature sono riferite al peso a secco, prima della cottura, salvo diversa indicazione.</p></div><div class="result"><div class="kicker">LA TUA SOSTITUZIONE</div><h3>${safe(a[0])}</h3><strong>${safe(a[1])}</strong><div class="arrow">↓</div><h3>${safe(b[0])}</h3><strong>${safe(b[1])}</strong>${state.group==='proteine'&&a[2]!==b[2]?'<p class="notice">Stai cambiando categoria proteica: controlla le frequenze settimanali.</p>':''}</div></div><div class="tip" style="margin-top:18px">Le opzioni sono raggruppate secondo le quantità esplicitamente indicate nel documento. I carboidrati del pranzo e quelli della cena sono separati perché il piano fornisce porzioni differenti. Le alternative tra gruppi proteici non sono necessariamente equivalenti dal punto di vista nutrizionale: segui le frequenze indicate.</div><div class="sectionhead"><h2>Altre possibilità</h2></div><div class="cards"><article class="card"><strong>Verdure</strong><p class="small muted">Tutte intercambiabili. Alterna crude e cotte, preferisci quelle di stagione; surgelate sì, se prive di condimenti aggiunti.</p></article><article class="card"><strong>Frutta</strong><p class="small muted">Circa 300 g al giorno. Una porzione media è 150–200 g, da distribuire liberamente durante la giornata.</p></article></div>`}
function guide(){const entries=[['Frequenze dei secondi','<ul><li>Legumi e derivati: circa 2–3 volte/settimana</li><li>Pesce: 2–3 volte/settimana</li><li>Carne: massimo 3 volte/settimana</li><li>Formaggi: massimo 2 volte/settimana</li><li>Salumi: il meno possibile, massimo 1 volta/settimana</li></ul>'],['Se mangi fuori','Preferisci un secondo con contorno di verdure e, se possibile, condimenti a parte. Il piano prevede anche un piccolo panino o un pacchetto di grissini.'],['Primi piatti','Condisci con pomodoro e/o verdure. Puoi aggiungere proteine per creare un piatto unico. Se mangi un primo a cena, evita di aggiungere anche il pane.'],['Olio e condimenti','15 g di olio a pranzo e 15 g a cena, per 30 g al giorno. Per 10 g di olio: 20 g di pesto, 40 g di avocado o 15 g di maionese, da limitare durante la settimana.'],['Acqua e movimento','Almeno 1,5–2 litri di liquidi al giorno e una camminata di almeno 30 minuti consecutivi.'],['Pasto libero','È una scelta occasionale e consapevole (per esempio pizza o lasagne), non un pasto senza limiti e non un’abitudine ripetuta più volte nella settimana.'],['Caffè, sale e spezie','Non superare 3 caffè al giorno ed evita caffeina/teina dal tardo pomeriggio. Riduci il sale; usa erbe aromatiche e spezie non piccanti.'],['Come pesare gli alimenti','Il peso si riferisce all’alimento a secco, prima della cottura e al netto degli scarti, salvo indicazioni esplicite diverse.'],['Nota sulle uova','Le uova sono menzionate tra le fonti proteiche e nella legenda del menù, ma il documento non fornisce una grammatura o una frequenza specifica: non ne viene suggerita una dall’app.']];return header('Le regole, semplici.','Tutte le indicazioni pratiche in un unico posto.')+`<div class="rules">${entries.map(([a,b])=>`<article class="card"><h3>${a}</h3><div class="small muted">${b}</div></article>`).join('')}</div><p class="foot">Fonte: piano alimentare della Dott.ssa Sara Basilico, 23 ottobre 2026, pp. 1–5. Questa app non sostituisce la valutazione della professionista.</p>`}
function render(){const tabs=[['oggi','Oggi'],['settimana','Settimana'],['sostituzioni','Sostituzioni'],['guida','Guida']];for(const id of ['desktopnav','mobilenav'])document.getElementById(id).innerHTML=tabs.map(([k,n])=>`<button data-tab="${k}" class="${state.tab===k?'active':''}">${icons[k]}${n}</button>`).join('');document.getElementById('main').innerHTML=({oggi:today,settimana:week,sostituzioni:substitutions,guida:guide})[state.tab]();save()}
function modal(html){document.getElementById('modalroot').innerHTML=`<div class="overlay" data-overlay="1"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}function close(){document.getElementById('modalroot').innerHTML=''}
function edit(i){const m=current(state.day,i);modal(`<div class="modalhead"><h2>Personalizza ${i?'la cena':'il pranzo'}</h2><button class="close" data-close="1" aria-label="Chiudi">×</button></div><p>Scrivi il piatto che hai scelto. Le quantità non vengono calcolate automaticamente: verifica sempre il piano.</p><label class="fieldlabel" for="mealtext">IL TUO PIATTO</label><input id="mealtext" class="field" maxlength="200" value="${safe(m[0])}"><label class="fieldlabel" for="mealcat">FONTE PROTEICA PRINCIPALE</label><select class="field" id="mealcat">${[['carne','Carne'],['pesce','Pesce'],['legumi','Legumi / derivati'],['formaggi','Formaggi'],['salumi','Salumi'],['libero','A scelta / pasto libero']].map(([id,n])=>`<option value="${id}" ${m[1]===id?'selected':''}>${n}</option>`).join('')}</select><div class="notice">Se il piatto contiene più fonti proteiche, questa categoria è solo descrittiva. L'app non certifica le frequenze settimanali.</div><div style="margin-top:18px"><button class="btn" data-save-meal="${i}">Salva questo pasto</button></div>`)}
function shopping(){const items=['Latte parzialmente scremato','Pane integrale','Marmellata o miele','Frutta fresca','Frutta secca / semi oleosi','Cracker','Yogurt greco 0%','Verdure di stagione','Olio extravergine di oliva',...new Set(base.flat().map(x=>x[1]).filter(x=>x!=='libero').map(x=>({carne:'Carne magra',pesce:'Pesce fresco',legumi:'Legumi / derivati',formaggi:'Formaggi freschi magri'})[x]))];modal(`<div class="modalhead"><h2>Lista della spesa</h2><button class="close" data-close="1">×</button></div><p>Promemoria orientativo per la settimana, non una lista con quantità calcolate. Controlla i piatti che hai personalizzato.</p><div class="shopping">${items.map((x,i)=>`<label><input type="checkbox" data-shop="${i}" ${state.shopChecks[i]?'checked':''}>${safe(x)}</label>`).join('')}</div><div style="margin-top:18px"><button class="btn" data-copy="1">Copia la lista</button></div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(e.target.dataset.overlay==='1'){close();return}if(!b)return;const d=b.dataset;if(d.close){close()}else if(d.tab){state.tab=d.tab;render();scrollTo(0,0)}else if(d.day!==undefined){state.day=+d.day;render()}else if(d.openDay!==undefined){state.day=+d.openDay;state.tab='oggi';render();scrollTo(0,0)}else if(d.done!==undefined){let k=state.day+'-'+d.done;state.done[k]=!state.done[k];render()}else if(d.edit!==undefined){edit(+d.edit)}else if(d.reset!==undefined){delete state.custom[state.day+'-'+d.reset];render()}else if(d.saveMeal!==undefined){let t=document.getElementById('mealtext').value.trim();if(!t)return;state.custom[state.day+'-'+d.saveMeal]=[t,document.getElementById('mealcat').value,0];close();render()}else if(d.group){state.group=d.group;state.from=0;state.to=1;render()}else if(d.guide){state.group=d.guide;state.from=0;state.to=1;state.tab='sostituzioni';render();scrollTo(0,0)}else if(d.shopping){shopping()}else if(d.copy){const labels=[...document.querySelectorAll('.shopping label')].filter(x=>!x.querySelector('input').checked).map(x=>'- '+x.textContent.trim());navigator.clipboard?.writeText(labels.join('\n')).then(()=>{b.textContent='Lista copiata ✓'}).catch(()=>{b.textContent='Copia non disponibile'})}});document.addEventListener('change',e=>{if(e.target.id==='from'){state.from=+e.target.value;render()}else if(e.target.id==='to'){state.to=+e.target.value;render()}else if(e.target.dataset.shop!==undefined){state.shopChecks[e.target.dataset.shop]=e.target.checked;save()}});render();
</script></body></html>
